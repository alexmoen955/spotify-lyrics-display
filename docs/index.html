<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyrics Display</title>
<meta name="description" content="Spotify now playing and synced lyrics on an ESP32 with a 1.44 inch screen.">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f4f1f8;
font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#371955,#0a414b) fixed}
.card{max-width:460px;margin:16px;padding:24px;border-radius:16px;background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.12)}
h1{font-size:22px;margin:0 0 8px}a{color:#6ee6aa}.dim{color:#b9b2c6}.err{color:#ff7a8a}
</style></head><body><div class="card" id="box">
<h1>Lyrics Display</h1>
<p class="dim">Spotify "now playing" with synced lyrics and album art on an ESP32 and a 1.44" screen.</p>
<p>Source code and setup guide: <a href="https://github.com/alexmoen955/spotify-lyrics-display">github.com/alexmoen955/spotify-lyrics-display</a></p>
</div>
<script>
// Spotify only redirects logins to https pages, but the display lives on your
// local network over http. This page passes the login straight back to the
// display. The display's address travels in the "state" parameter, which the
// display created itself. Nothing is stored or sent anywhere else.
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.has('state')) return;
  var state = q.get('state'), i = state.indexOf('|');
  var device = i >= 0 ? state.slice(i + 1) : '';
  // only ever forward to an address on your own network
  var local = /^http:\/\/(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|[a-z0-9-]+\.local)(:\d{1,5})?$/i;
  var box = document.getElementById('box');
  if (!local.test(device)) {
    box.innerHTML = '<h1>Lyrics Display</h1><p class="err">This login link looks wrong. Go back to your display\'s page and click <b>Connect Spotify</b> again.</p>';
    return;
  }
  box.innerHTML = '<h1>Lyrics Display</h1><p>Sending you back to your display…</p>' +
    '<p class="dim">Nothing happening? Make sure this device is on the same Wi-Fi as the display, then <a href="' +
    device + '/spotify/callback' + location.search.replace(/"/g, '') + '">click here</a>.</p>';
  location.replace(device + '/spotify/callback' + location.search);
})();
</script>
</body></html>
